project_name: "AI Mental Wellness - Facial Emotion Recognition"

paths:
  train_dir: "dataset/processed/train"
  val_dir: "dataset/processed/validation"
  test_dir: "dataset/processed/test"
  checkpoint_dir: "saved_models"
  log_dir: "logs"

classes:
  - angry
  - disgust
  - fear
  - happy
  - neutral
  - sad
  - surprise

model:
  name: "efficientnet_b0"
  pretrained: true
  num_classes: 7
  input_size: 224

training:
  batch_size: 16

  # Give the model more time to converge.
  num_epochs: 10

  # Classifier/head learning rate.
  learning_rate: 0.0002

  # Much smaller LR for pretrained EfficientNet backbone.
  backbone_learning_rate: 0.00001

  weight_decay: 0.00003

  optimizer: "adamw"

  scheduler: "cosine"

  # Allow several epochs of plateau before stopping.
  early_stopping_patience: 7

  num_workers: 4
  device: "cuda"

augmentation:
  horizontal_flip_prob: 0.5
  rotation_degrees: 12
  brightness: 0.20
  contrast: 0.20

inference:
  smoothing_window: 8
  face_detection_confidence: 0.6
  webcam_index: 0
  frame_skip: 2

backend:
  api_base_url: "http://localhost:8000"
  emotion_endpoint: "/api/sessions/{session_id}/emotions"
  timeout_seconds: 5